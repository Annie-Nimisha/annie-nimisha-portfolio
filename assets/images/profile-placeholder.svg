<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa" />
      <stop offset="100%" stop-color="#fbcfe8" />
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#6366f1" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="400" height="400" rx="32" fill="url(#bgGlow)" />
  <rect width="396" height="396" x="2" y="2" rx="30" fill="none" stroke="url(#accentGrad)" stroke-width="2" stroke-opacity="0.4"/>

  <!-- Subtle Tech Grid Lines -->
  <path d="M40 0 v400 M120 0 v400 M200 0 v400 M280 0 v400 M360 0 v400" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.05" />
  <path d="M0 40 h400 M0 120 h400 M0 200 h400 M0 280 h400 M0 360 h400" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.05" />

  <!-- Outer Ring Glow -->
  <circle cx="200" cy="180" r="115" fill="none" stroke="url(#accentGrad)" stroke-width="3" stroke-dasharray="6 8" stroke-opacity="0.6"/>
  <circle cx="200" cy="180" r="105" fill="#131c31" filter="url(#cardShadow)"/>

  <!-- Female Developer Avatar Illustration -->
  <!-- Hair back -->
  <path d="M140 180 C135 120 265 120 260 180 C260 215 250 250 240 265 C230 250 230 230 230 230 C200 230 170 230 170 230 C170 230 170 250 160 265 C150 250 140 215 140 180 Z" fill="#2d1b4e" />

  <!-- Shoulders & Outfit (Purple / Tech style) -->
  <path d="M125 330 C130 270 170 250 200 250 C230 250 270 270 275 330 Z" fill="url(#accentGrad)" opacity="0.9"/>
  <!-- Collar -->
  <path d="M185 250 L200 275 L215 250 Z" fill="#0f172a" />

  <!-- Neck -->
  <rect x="188" y="220" width="24" height="35" rx="6" fill="#fbcfe8" />

  <!-- Face -->
  <ellipse cx="200" cy="180" rx="42" ry="50" fill="#fed7aa" />

  <!-- Hair front / Bangs -->
  <path d="M158 165 C165 130 235 130 242 165 C230 155 210 155 200 160 C190 155 170 155 158 165 Z" fill="#3b2064" />
  <path d="M158 165 C155 185 156 220 165 240 C160 220 160 185 160 170 Z" fill="#3b2064" />
  <path d="M242 165 C245 185 244 220 235 240 C240 220 240 185 240 170 Z" fill="#3b2064" />

  <!-- Glasses (Modern Developer Aesthetic) -->
  <circle cx="185" cy="178" r="14" fill="none" stroke="#38bdf8" stroke-width="2.5" />
  <circle cx="215" cy="178" r="14" fill="none" stroke="#38bdf8" stroke-width="2.5" />
  <line x1="199" y1="178" x2="201" y2="178" stroke="#38bdf8" stroke-width="2.5" />
  <path d="M171 176 L160 173 M229 176 L240 173" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>

  <!-- Eyes behind glasses -->
  <circle cx="185" cy="178" r="3" fill="#1e1b4b" />
  <circle cx="215" cy="178" r="3" fill="#1e1b4b" />
  <circle cx="186" cy="177" r="1" fill="#ffffff" />
  <circle cx="216" cy="177" r="1" fill="#ffffff" />

  <!-- Smile -->
  <path d="M192 205 Q200 213 208 205" fill="none" stroke="#e11d48" stroke-width="2.5" stroke-linecap="round" />

  <!-- Decorative Badge at bottom -->
  <g transform="translate(100, 345)">
    <rect width="200" height="34" rx="17" fill="#0f172a" stroke="url(#accentGrad)" stroke-width="1.5" />
    <text x="100" y="21" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-weight="600" font-size="12" fill="#e2e8f0" text-anchor="middle" letter-spacing="0.5">A.P. Annie Nimisha</text>
  </g>

  <!-- Floating code brackets -->
  <text x="75" y="140" font-family="monospace" font-weight="bold" font-size="22" fill="#38bdf8" opacity="0.7">&lt;/&gt;</text>
  <text x="305" y="220" font-family="monospace" font-weight="bold" font-size="20" fill="#a855f7" opacity="0.7">{ ; }</text>
  <text x="300" y="130" font-family="sans-serif" font-size="16" fill="#f59e0b" opacity="0.8">✦</text>
  <text x="85" y="240" font-family="sans-serif" font-size="14" fill="#38bdf8" opacity="0.8">✦</text>
</svg>
